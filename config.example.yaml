# Nextcloud AI Organizer
#
# Deployment-specific addresses and credentials belong in environment variables
# (.env for local/manual Docker testing). This file contains only non-secret
# application behavior defaults.

nextcloud:
  # Keep TLS verification enabled for HTTPS unless you intentionally use a
  # self-signed certificate that the container cannot validate yet.
  verify_ssl: true
  timeout: 60

  # Folder roots used when giving the LLM your existing folder structure.
  # "/" means the user's whole Files root.
  folder_tree_paths:
    - "/"

scanner:
  scan_paths:
    - "/AI Inbox"

  exclude_paths:
    - "/paperless-media"
    - "/inbox"
    - "/Photos"
    - "/AI Ignored"

  allowed_extensions:
    - pdf
    - txt
    - md
    - docx
    - odt
    - rtf
    - log
    - csv
    - json
    - xml
    - xlsx

ollama:
  # OLLAMA_URL and OLLAMA_MODEL are deployment settings and are intentionally
  # not defined here. They must be supplied for a new installation.
  timeout: 180
  temperature: 0

classifier:
  max_content_chars: 8000
  max_folder_entries: 500
  max_tag_entries: 200
  minimum_confidence: 0.70

paperless:
  # These document categories must remain in Nextcloud even if the local LLM
  # mistakenly marks them as Paperless candidates.
  never_send:
    - resume
    - cv
    - curriculum vitae
    - cover letter
    - portfolio
    - source_code
    - project
    - template

  # Advisory category preferences. never_send always takes precedence.
  prefer_send:
    - receipt
    - invoice
    - statement
    - tax
    - insurance
    - contract
    - warranty

database:
  # Manual Docker/Compose path. Keep /app/data on a persistent volume.
  path: "/app/data/ai_organizer.db"
